name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download licensed football photos for offline careers
        if: github.ref_type == 'branch'
        run: |
          python3 scripts/download_game_photos.py
          if find public/media/game -type f ! -name manifest.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/media/game
            if ! git diff --cached --quiet; then
              git commit -m "assets: bundle offline football career photography"
              git fetch origin main
              git rebase origin/main
              git push
            fi
          fi

      - name: Download reviewed Pixabay media for offline APK
        if: github.ref_type == 'branch'
        run: |
          python3 scripts/download_pixabay_media.py
          if find public/media/pixabay -type f ! -name manifest.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/media/pixabay
            if ! git diff --cached --quiet; then
              git commit -m "assets: bundle Pixabay media for offline play"
              git fetch origin main
              git rebase origin/main
              git push
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Generate Football Dynasty launcher icons
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 scripts/generate_android_icon.py

      - name: Build debug APK for branch testing
        if: github.ref_type == 'branch'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Check release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)

      - name: Restore private Android release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/football-dynasty-release.jks"
          chmod 600 "$RUNNER_TEMP/football-dynasty-release.jks"
          test -s "$RUNNER_TEMP/football-dynasty-release.jks"

      - name: Build unsigned release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Align and sign release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/football-dynasty-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/football-dynasty-$GITHUB_REF_NAME.apk"
          test -s "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/football-dynasty-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          "$BUILD_TOOLS/aapt" dump badging "$SIGNED" | head -n 5
          unzip -t "$SIGNED"
          rm -f "$ALIGNED"
          echo "Signed beta APK: $SIGNED"

      - name: Verify debug APK
        if: github.ref_type == 'branch'
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Upload debug APK artifact
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: football-dynasty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed beta APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: football-dynasty-signed-beta-apk
          path: android/app/build/outputs/apk/release/football-dynasty-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Publish signed public beta release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Football Dynasty 2.0 – ${{ github.ref_name }} Public Beta
          body: |
            ## Football Dynasty 2.0 – Public Beta

            Thank you for testing Football Dynasty.

            - Download the signed Android APK asset below.
            - This is a beta build and may contain bugs.
            - Please report issues through the repository's Issues page.
            - Do not download the source-code ZIP to install the Android app.
          files: android/app/build/outputs/apk/release/football-dynasty-${{ github.ref_name }}.apk
          prerelease: true
          make_latest: false
