name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK package and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-dynasty-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: football-dynasty-build-${{ github.run_number }}
          name: Football Dynasty Android build ${{ github.run_number }}
          body: "Install the APK asset directly. Do not download or install the source ZIP."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
