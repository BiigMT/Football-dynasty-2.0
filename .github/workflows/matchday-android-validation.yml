name: Matchday Android validation

on:
  push:
    branches:
      - feature/complete-squads-deeper-3d-engine
      - feature/global-verified-squads-physics
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint
      - name: Validate official squad data
        run: npm run validate:squads

      - name: Validate world manager simulation
        run: npm run validate:world-managers

      - name: Validate 3D player positioning
        run: npm run validate:positioning

      - name: Validate 3D match physics
        run: npm run validate:physics

      - name: Production web build
        run: npm run build

      - name: Add Android platform when absent
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK integrity and signing
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: football-dynasty-matchday-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
